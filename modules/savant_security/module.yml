# Video Analytics security runtime module.
#
# RTSP frames arrive through a Savant ZMQ source, then run YOLO26-pose,
# nvtracker, YOLOv8-Face, AdaFace, rule evaluation, and Redis export.

name: savant_security

parameters:
  log_level: ${oc.env:LOGLEVEL, INFO}
  batch_size: ${oc.decode:${oc.env:BATCH_SIZE, 1}}
  max_parallel_streams: ${oc.decode:${oc.env:MAX_PARALLEL_STREAMS, 1}}
  max_fps_control: ${oc.decode:${oc.env:MAX_FPS_CONTROL, false}}
  ingress_fps_gate_enabled: ${oc.decode:${oc.env:INGRESS_FPS_GATE_ENABLED, true}}
  max_fps: ${oc.env:MAX_FPS, 8/1}
  min_fps: ${oc.env:MIN_FPS, 2/1}
  pose_batch_size: ${oc.decode:${oc.env:POSE_BATCH_SIZE, 1}}
  pose_infer_interval: ${oc.decode:${oc.env:POSE_INFER_INTERVAL, 0}}
  pose_confidence_threshold: ${oc.decode:${oc.env:POSE_CONFIDENCE_THRESHOLD, 0.25}}
  pose_keypoint_threshold: ${oc.decode:${oc.env:POSE_KEYPOINT_THRESHOLD, 0.25}}
  pose_force_nms: ${oc.decode:${oc.env:POSE_FORCE_NMS, true}}
  pose_selector_confidence_threshold: ${oc.decode:${oc.env:POSE_SELECTOR_CONFIDENCE_THRESHOLD, 0.25}}
  pose_selector_nms_iou_threshold: ${oc.decode:${oc.env:POSE_SELECTOR_NMS_IOU_THRESHOLD, 0.6}}
  pose_min_width: ${oc.decode:${oc.env:POSE_MIN_WIDTH, 20}}
  pose_min_height: ${oc.decode:${oc.env:POSE_MIN_HEIGHT, 40}}
  pose_coordinate_restore_mode: ${oc.env:POSE_COORDINATE_RESTORE_MODE, letterbox}
  face_infer_interval: ${oc.decode:${oc.env:FACE_INFER_INTERVAL, 0}}
  face_detector_batch_size: ${oc.decode:${oc.env:FACE_DETECTOR_BATCH_SIZE, 1}}
  face_embedding_infer_interval: ${oc.decode:${oc.env:FACE_EMBEDDING_INFER_INTERVAL, 0}}
  face_embedding_batch_size: ${oc.decode:${oc.env:FACE_EMBEDDING_BATCH_SIZE, 16}}
  face_confidence_threshold: ${oc.decode:${oc.env:FACE_CONFIDENCE_THRESHOLD, 0.25}}
  face_nms_iou_threshold: ${oc.decode:${oc.env:FACE_NMS_IOU_THRESHOLD, 0.5}}
  face_min_width: ${oc.decode:${oc.env:FACE_MIN_WIDTH, 40}}
  face_min_height: ${oc.decode:${oc.env:FACE_MIN_HEIGHT, 40}}
  max_same_source_frames: 1
  batched_push_timeout: ${oc.decode:${oc.env:BATCHED_PUSH_TIMEOUT, 40000}}
  queue_maxsize: 10
  telemetry:
    metrics:
      frame_period: ${oc.decode:${oc.env:METRICS_FRAME_PERIOD, 1000}}
      time_period: ${oc.decode:${oc.env:METRICS_TIME_PERIOD, 5}}
      history: ${oc.decode:${oc.env:METRICS_HISTORY, 100}}
      extra_labels: ${json:${oc.env:METRICS_EXTRA_LABELS, null}}

pipeline:
  source:
    element: zeromq_source_bin
    ingress_frame_filter:
      module: custom.filters.pts_fps_gate
      class_name: PtsFpsGate
      kwargs:
        enabled: ${parameters.ingress_fps_gate_enabled}
        max_fps: ${parameters.max_fps}
        min_fps: ${parameters.min_fps}
        log_every_n_frames: ${oc.decode:${oc.env:INGRESS_FPS_GATE_LOG_EVERY_N, 300}}
    properties:
      socket: ${oc.env:ZMQ_SRC_ENDPOINT}
      source_id: ${oc.decode:${oc.env:SOURCE_ID, null}}
      source_id_prefix: ${oc.decode:${oc.env:SOURCE_ID_PREFIX, null}}

  elements:
    # ------------------------------------------------------------------
    # ReplaySavantFrameDumpPyFunc — debug-only Replay->Savant pixel proof.
    # Disabled by default. When explicitly targeted by UUID/PTS, writes the
    # pre-inference Savant runtime frame for comparison against Replay media.
    # ------------------------------------------------------------------
    - element: pyfunc
      name: replay_savant_frame_dump
      module: custom.pyfuncs.replay_savant_frame_dump
      class_name: ReplaySavantFrameDumpPyFunc

    # ------------------------------------------------------------------
    # YOLO26-pose — person detection with 17 COCO keypoints.
    # ------------------------------------------------------------------
    - element: nvinfer@complex_model
      name: yolo26_pose
      properties:
        interval: ${parameters.pose_infer_interval}
      model:
        format: onnx
        model_file: /models/yolo26_pose/yolo26_pose.onnx
        batch_size: ${oc.decode:${oc.env:POSE_BATCH_SIZE, 1}}
        precision: fp16
        input:
          shape: [3, 640, 640]
          scale_factor: 0.003921569
          offsets: [0.0, 0.0, 0.0]
          color_format: rgb
        output:
          layer_names: [output0]
          converter:
            module: custom.converters.yolo26_pose
            class_name: Yolo26PoseConverter
            kwargs:
              decoder_layout: post_nms_57
              confidence_threshold: ${parameters.pose_confidence_threshold}
              keypoint_threshold: ${parameters.pose_keypoint_threshold}
              force_nms: ${parameters.pose_force_nms}
              nms_threshold: ${parameters.pose_selector_nms_iou_threshold}
              coordinate_restore_mode: ${parameters.pose_coordinate_restore_mode}
              debug_dump_enabled: ${oc.decode:${oc.env:POSE_CONVERTER_DEBUG_DUMP_ENABLED, false}}
              debug_dump_dir: ${oc.env:POSE_CONVERTER_DEBUG_DUMP_DIR, /data/video-analytics/artifacts/pose_converter_debug}
              debug_dump_max_records: ${oc.decode:${oc.env:POSE_CONVERTER_DEBUG_DUMP_MAX_RECORDS, 200}}
          objects:
            - class_id: 0
              label: person
              selector:
                module: savant.selector.detector
                class_name: BBoxSelector
                kwargs:
                  confidence_threshold: ${parameters.pose_selector_confidence_threshold}
                  nms_iou_threshold: ${parameters.pose_selector_nms_iou_threshold}
                  min_width: ${parameters.pose_min_width}
                  min_height: ${parameters.pose_min_height}
          attributes:
            - name: keypoints

    # ------------------------------------------------------------------
    # nvtracker — assign track_id to each person.
    # ------------------------------------------------------------------
    - element: nvtracker
      name: tracker
      properties:
        ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
        ll-config-file: /opt/savant/src/module/config/config_tracker_NvDCF_perf.yml

    # ------------------------------------------------------------------
    # BehaviorRulesPyFunc — registry-driven behavior rule adapter.
    # Reads cameras.midterm.yml at startup, routes per-source.
    # ------------------------------------------------------------------
    - element: pyfunc
      name: behavior_rules
      module: custom.pyfuncs.behavior_rules
      class_name: BehaviorRulesPyFunc
      kwargs:
        log_every_n_frames: 15
        cameras_config_path: ${oc.env:CAMERAS_CONFIG_PATH, /opt/savant/src/module/config/cameras.midterm.yml}
        producer: savant_security
        gpu_id: 0
        observation_window_s: 5.0
        track_timeout_s: 10.0

    # ------------------------------------------------------------------
    # YOLOv8-Face — full-frame face detector with 5-point landmarks.
    # Static batch = 1 (model constraint).
    # Official converter: savant.converter.yolo_v8face.
    # ------------------------------------------------------------------
    - element: nvinfer@complex_model
      name: yolov8_face
      properties:
        interval: ${parameters.face_infer_interval}
      model:
        format: onnx
        model_file: /models/yolov8_face.onnx
        batch_size: ${oc.decode:${oc.env:FACE_DETECTOR_BATCH_SIZE, 1}}
        precision: fp16
        input:
          shape: [3, 640, 640]
          scale_factor: 0.003921569
          offsets: [0.0, 0.0, 0.0]
          color_format: rgb
        output:
          layer_names: [output0]
          converter:
            module: savant.converter.yolo_v8face
            class_name: YoloV8faceConverter
            kwargs:
              confidence_threshold: ${parameters.face_confidence_threshold}
              nms_iou_threshold: ${oc.decode:${oc.env:FACE_NMS_IOU_THRESHOLD, 0.5}}
          objects:
            - class_id: 0
              label: face
              selector:
                module: savant.selector.detector
                class_name: MinMaxSizeBBoxSelector
                kwargs:
                  min_width: ${oc.decode:${oc.env:FACE_MIN_WIDTH, 40}}
                  min_height: ${oc.decode:${oc.env:FACE_MIN_HEIGHT, 40}}
          attributes:
            - name: landmarks

    # ------------------------------------------------------------------
    # FacePersonAssociatorPyFunc — face-person association.
    # Links YOLOv8-Face detections to YOLO26-pose person tracks.
    # Attaches person_track_id / association_score to face objects.
    # Does NOT emit face observations to Redis.
    # ------------------------------------------------------------------
    - element: pyfunc
      name: face_person_associator
      module: custom.pyfuncs.face_person_associator
      class_name: FacePersonAssociatorPyFunc
      kwargs:
        log_every_n_frames: 30

    # ------------------------------------------------------------------
    # AdaFace — face embedding attribute model.
    # Runs on aligned face crops from YOLOv8-Face detections.
    # Outputs 512-d feature vector (NOT L2-normalized).
    # Official sample pattern: nvinfer@attribute_model + AlignFace + TensorToVector.
    # ------------------------------------------------------------------
    - element: nvinfer@attribute_model
      name: adaface
      model:
        format: onnx
        model_file: /models/adaface/adaface_ir50_webface4m.onnx
        interval: ${parameters.face_embedding_infer_interval}
        batch_size: ${oc.decode:${oc.env:FACE_EMBEDDING_BATCH_SIZE, 16}}
        precision: fp16
        input:
          object: yolov8_face.face
          shape: [3, 112, 112]
          offsets: [127.5, 127.5, 127.5]
          scale_factor: 0.007843137254902
          color_format: bgr
          preprocess_object_image:
            module: savant.input_preproc.align_face
            class_name: AlignFacePreprocessingObjectImageGPU
        output:
          layer_names: [feature]
          converter:
            module: savant.converter
            class_name: TensorToVectorConverter
          attributes:
            - name: feature

    # ------------------------------------------------------------------
    # FaceReidGatePyFunc — quality gate + per-track throttle.
    # Evaluates face quality and embedding eligibility for ReID.
    # Attaches reid_allowed / reid_skip_reason / reid_quality_score.
    # Does NOT emit face observations to Redis.
    # ------------------------------------------------------------------
    - element: pyfunc
      name: face_reid_gate
      module: custom.pyfuncs.face_reid_gate
      class_name: FaceReidGatePyFunc
      kwargs:
        log_every_n_frames: 30
        cameras_config_path: ${oc.env:CAMERAS_CONFIG_PATH, /opt/savant/src/module/config/cameras.midterm.yml}
        face_detector_confidence_threshold: ${parameters.face_confidence_threshold}
        face_reid_min_confidence: ${oc.decode:${oc.env:FACE_REID_MIN_CONFIDENCE, 0.45}}
        face_reid_min_face_size: ${oc.decode:${oc.env:FACE_REID_MIN_FACE_SIZE, 40.0}}
        face_reid_min_interval_ms: ${oc.decode:${oc.env:FACE_REID_MIN_INTERVAL_MS, 1000}}
        face_reid_norm_tolerance: ${oc.decode:${oc.env:FACE_REID_NORM_TOLERANCE, 0.10}}

    # ------------------------------------------------------------------
    # FaceObservationExporterPyFunc — Redis face observation producer.
    # Exports reid_allowed=true face observations to Redis Stream
    # security.face_observations. No image bytes. No pgvector/watchlist.
    # ------------------------------------------------------------------
    - element: pyfunc
      name: face_observation_exporter
      module: custom.pyfuncs.face_observation_exporter
      class_name: FaceObservationExporterPyFunc
      kwargs:
        log_every_n_frames: 30
        producer: savant_security
        cameras_config_path: ${oc.env:CAMERAS_CONFIG_PATH, /opt/savant/src/module/config/cameras.midterm.yml}
        export_min_interval_ms: ${oc.decode:${oc.env:FACE_REID_MIN_INTERVAL_MS, 1000}}

    # ------------------------------------------------------------------
    # FrameAnnotationExporterPyFunc — lightweight.
    # Exports lightweight per-frame person/face metadata to bounded Redis
    # Stream security.frame_annotations when FRAME_ANNOTATION_EXPORT_ENABLED=true.
    # Default is disabled/no-op. No image bytes. No embedding vectors.
    # ------------------------------------------------------------------
    - element: pyfunc
      name: frame_annotation_exporter
      module: custom.pyfuncs.frame_annotation_exporter
      class_name: FrameAnnotationExporterPyFunc
      kwargs:
        enabled: ${oc.decode:${oc.env:FRAME_ANNOTATION_EXPORT_ENABLED, false}}
        log_every_n_frames: ${oc.decode:${oc.env:FRAME_ANNOTATION_LOG_EVERY_N, 300}}
        producer: savant-security
        cameras_config_path: ${oc.env:CAMERAS_CONFIG_PATH, /opt/savant/src/module/config/cameras.midterm.yml}
        stream: ${oc.env:FRAME_ANNOTATION_STREAM, security.frame_annotations}
        ttl_seconds: ${oc.decode:${oc.env:FRAME_ANNOTATION_TTL_SECONDS, 120}}
        max_objects_per_frame: ${oc.decode:${oc.env:FRAME_ANNOTATION_MAX_OBJECTS_PER_FRAME, 100}}
        include_keypoints: ${oc.env:FRAME_ANNOTATION_INCLUDE_KEYPOINTS, compact}
        include_landmarks: ${oc.env:FRAME_ANNOTATION_INCLUDE_LANDMARKS, compact}
        include_embedding: ${oc.decode:${oc.env:FRAME_ANNOTATION_INCLUDE_EMBEDDING, false}}
        redis_maxlen: ${oc.decode:${oc.env:FRAME_ANNOTATION_REDIS_MAXLEN, 10000}}
        write_timeout_ms: ${oc.decode:${oc.env:FRAME_ANNOTATION_WRITE_TIMEOUT_MS, 500}}
        min_interval_ms: ${oc.decode:${oc.env:FRAME_ANNOTATION_EXPORT_MIN_INTERVAL_MS, 0}}

    # ------------------------------------------------------------------
    # SavantPerfMetricsPyFunc — stable project-level va_savant_* metrics.
    # Does not mutate metadata or emit events/evidence.
    # ------------------------------------------------------------------
    - element: pyfunc
      name: savant_perf_metrics
      module: custom.pyfuncs.savant_perf_metrics
      class_name: SavantPerfMetricsPyFunc
      kwargs:
        fps_window_s: ${oc.decode:${oc.env:SAVANT_PERF_METRICS_FPS_WINDOW_S, 10}}
