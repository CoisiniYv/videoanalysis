cameras:
  primary_rtsp:
    enabled: true
    source_id: primary_rtsp
    name: Primary RTSP Camera
    rtsp_url: rtsp://192.168.1.105:8554/live/1080movie
    gpu_id: 0
    zones:
      primary_full_frame:
        type: polygon
        points:
          - [0.0, 0.0]
          - [1920.0, 0.0]
          - [1920.0, 1080.0]
          - [0.0, 1080.0]
    rules:
      intrusion:
        enabled: true
        rule_id: primary_intrusion_rule
        zone: primary_full_frame
        severity: medium
        cooldown_s: 30
        clip_required: true
        snapshot_required: false
        min_inside_ms: 1
        min_person_confidence: 0.25
        min_person_width: 20
        min_person_height: 40
        min_visible_keypoints: 0
        max_bbox_area_ratio: 0.9
