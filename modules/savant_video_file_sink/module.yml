# Savant Video File Sink Adapter
# Receives video via ZMQ from Replay Service and writes to disk.
#
# Output directory: /media/replay-sink-output
# Output format: metadata.json + video.{container}
#
# Environment:
#   ZMQ_SRC_ENDPOINT                     — ZMQ source endpoint
#   SINK_OUTPUT_DIR                      — output directory
#   SINK_CONTAINER (default mkv)         — output container format

name: savant_video_file_sink

parameters:
  log_level: ${oc.env:LOGLEVEL, INFO}
  zmq_endpoint: ${oc.env:ZMQ_SRC_ENDPOINT, pub+connect:tcp://0.0.0.0:6666}
  output_dir: ${oc.env:SINK_OUTPUT_DIR, /media/replay-sink-output}
  container: ${oc.env:SINK_CONTAINER, mkv}

pipeline:
  source:
    element: zeromq_source_bin
    properties:
      socket: SUB
      connect:
        - ${parameters.zmq_endpoint}
      source_id_prefix: replay-sink-

  elements:
    - element: always_on_rtmp_sink
      name: video_file_sink
      properties:
        location: ${parameters.output_dir}
