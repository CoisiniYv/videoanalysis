    depends_on:
      replay-raw-fanout-b: { condition: service_started }
    restart: unless-stopped

  replay-raw-fanout:
    build:
      context: ../services/analysis-forwarder
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: video-analytics-midterm-analysis-forwarder:latest
    container_name: video-analytics-midterm-replay-raw-fanout
    environment:
      LOGLEVEL: ${LOGLEVEL:-INFO}
      FORWARDER_IN_ENDPOINT: router+bind:tcp://0.0.0.0:5557
      FORWARDER_OUT_ENDPOINT: dealer+connect:tcp://analysis-forwarder:5557
      FORWARDER_RAW_OUT_ENDPOINT: pub+bind:tcp://0.0.0.0:5560
      FORWARDER_SAMPLER_ENABLED: "false"
      FORWARDER_QUEUE_MAX_SIZE: "${REPLAY_RAW_FANOUT_QUEUE_MAX_SIZE:-8192}"
      FORWARDER_RECEIVE_TIMEOUT_MS: "${REPLAY_RAW_FANOUT_RECEIVE_TIMEOUT_MS:-1000}"
      FORWARDER_RECEIVE_HWM: "${REPLAY_RAW_FANOUT_RECEIVE_HWM:-10000}"
      FORWARDER_SEND_TIMEOUT_MS: "${REPLAY_RAW_FANOUT_SEND_TIMEOUT_MS:-1000}"
      FORWARDER_SEND_RETRIES: "${REPLAY_RAW_FANOUT_SEND_RETRIES:-2}"
      FORWARDER_SEND_HWM: "${REPLAY_RAW_FANOUT_SEND_HWM:-10000}"
      FORWARDER_METRICS_PORT: "8081"
    ports:
      - "${REPLAY_RAW_FANOUT_METRICS_HOST_PORT:-18184}:8081"
    depends_on:
      analysis-forwarder: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

