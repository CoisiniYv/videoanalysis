# Midterm single-camera deployment topology.
#
# Official recording order:
#   RTSP source -> Replay storage -> Savant inference -> Redis/Postgres
#   event -> Replay job -> video-file-sink -> media-worker evidence bundle
#
# Evidence policy:
#   raw_clip is the Replay/video-file-sink original video output.
#   annotations are JSONL sidecars consumed by the 8090 operator portal.
#   annotated video clips are not generated.

name: video-analytics-midterm

services:
  redis:
    image: redis:7-alpine
    container_name: video-analytics-midterm-redis
    ports:
      - "6396:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: video-analytics-midterm-qdrant
    profiles: ["qdrant"]
    expose:
      - "6333"
    volumes:
      - /data/video-analytics/qdrant-midterm:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile.face-runtime
      args:
        BUILDKIT_INLINE_CACHE: "1"
        FACE_RUNTIME_IMAGE: video-analytics-midterm-face-worker:latest
    image: video-analytics-midterm-api:latest
    container_name: video-analytics-midterm-api
    environment:
      DATABASE_URL: ${VIDEO_ANALYTICS_DATABASE_URL:-postgresql://video:video@host.docker.internal:5432/video_analytics}
      MEDIA_ROOT: /data/video-analytics/media
      FACE_UPLOAD_ROOT: /data/video-analytics/media/face_uploads
      FACE_REGISTRATION_ROOT: /data/video-analytics/media/face_registration
      FACE_UPLOAD_MAX_BYTES: "${FACE_UPLOAD_MAX_BYTES:-10485760}"
      YOLOV8_FACE_ONNX: ${YOLOV8_FACE_ONNX:-/data/video-analytics/models/yolov8_face/yolov8n-face.onnx}
      ADAFACE_ONNX: ${ADAFACE_ONNX:-/data/video-analytics/models/adaface/adaface_ir50_webface4m.onnx}
      FACE_REGISTRATION_ONNX_PROVIDER: ${FACE_REGISTRATION_ONNX_PROVIDER:-CUDAExecutionProvider,CPUExecutionProvider}
      STORAGE_MAINTENANCE_SUMMARY_ENABLED: "${STORAGE_MAINTENANCE_SUMMARY_ENABLED:-true}"
      STORAGE_MAINTENANCE_PREVIEW_ENABLED: "${STORAGE_MAINTENANCE_PREVIEW_ENABLED:-true}"
      STORAGE_MAINTENANCE_EXECUTE_ENABLED: "${STORAGE_MAINTENANCE_EXECUTE_ENABLED:-false}"
      REDIS_URL: redis://redis:6379/0
      ALERT_STREAM: security.alerts
      CAMERA_RUNTIME_APPLY_ENABLED: "${CAMERA_RUNTIME_APPLY_ENABLED:-true}"
      CAMERA_RUNTIME_MODULE_CONFIG_PATH: /app/modules/savant_security/config/cameras.midterm.yml
      CAMERA_RUNTIME_SOURCES_CONFIG_PATH: /app/infra/generated/sources.generated.yml
      CAMERA_RUNTIME_ZMQ_ENDPOINT: dealer+connect:tcp://replay-service:5555
      REPLAY_API_URL: http://replay-service:8080
      REPLAY_JOB_SINK_URL: dealer+connect:tcp://video-file-sink:6666
      REPLAY_SHARDS_JSON: "${REPLAY_SHARDS_JSON:-}"
      REPLAY_SHARDS_CONFIG_PATH: "${REPLAY_SHARDS_CONFIG_PATH:-}"
      CAMERA_RUNTIME_DOCKER_NETWORK: video-analytics-midterm_default
      CAMERA_RUNTIME_REPLAY_CONTAINER: video-analytics-midterm-replay-service
      CAMERA_RUNTIME_FORWARDER_CONTAINER: video-analytics-midterm-analysis-forwarder
      CAMERA_RUNTIME_SAVANT_CONTAINER: video-analytics-midterm-savant
      CAMERA_RUNTIME_COMPOSE_SOURCE_CONTAINER: video-analytics-midterm-source-adapter
      CAMERA_RUNTIME_SOURCE_EOS_ON_START: "${CAMERA_RUNTIME_SOURCE_EOS_ON_START:-false}"
      CAMERA_RUNTIME_RTSP_TRANSPORT_PARAMS: "${CAMERA_RUNTIME_RTSP_TRANSPORT_PARAMS:-tcp,use_wallclock_as_timestamps=1,fflags=+genpts}"
      CAMERA_RUNTIME_EVENT_WORKER_CONTAINER: video-analytics-midterm-event-worker
      CAMERA_RUNTIME_FACE_WORKER_CONTAINER: video-analytics-midterm-face-worker
      CAMERA_RUNTIME_CLIP_WORKER_CONTAINER: video-analytics-midterm-clip-worker
      CAMERA_RUNTIME_MEDIA_WORKER_CONTAINER: video-analytics-midterm-media-worker
      CAMERA_RUNTIME_VIDEO_SINK_CONTAINER: video-analytics-midterm-video-file-sink
      SAVANT_SUPERVISOR_ENABLED: "${SAVANT_SUPERVISOR_ENABLED:-true}"
      SAVANT_SUPERVISOR_DOCKER_SOCKET: /var/run/docker.sock
      SAVANT_SUPERVISOR_SAVANT_CONTAINER: video-analytics-midterm-savant
      SAVANT_SUPERVISOR_REPLAY_CONTAINER: video-analytics-midterm-replay-service
      SAVANT_SUPERVISOR_COMPOSE_SOURCE_CONTAINER: video-analytics-midterm-source-adapter
      SAVANT_SUPERVISOR_DYNAMIC_SOURCE_PREFIX: video-analytics-source-
      SAVANT_SUPERVISOR_STATUS_FILE: /opt/savant/status.txt
      SAVANT_SUPERVISOR_ANNOTATION_STREAM: security.frame_annotations
      SAVANT_SUPERVISOR_POLL_INTERVAL_S: "${SAVANT_SUPERVISOR_POLL_INTERVAL_S:-10}"
      SAVANT_SUPERVISOR_STOPPED_GRACE_S: "${SAVANT_SUPERVISOR_STOPPED_GRACE_S:-20}"
      SAVANT_SUPERVISOR_STARTUP_GRACE_S: "${SAVANT_SUPERVISOR_STARTUP_GRACE_S:-1800}"
      SAVANT_SUPERVISOR_STALL_SECONDS: "${SAVANT_SUPERVISOR_STALL_SECONDS:-120}"
      SAVANT_SUPERVISOR_STALL_CHECK_ENABLED: "${SAVANT_SUPERVISOR_STALL_CHECK_ENABLED:-true}"
      SAVANT_SUPERVISOR_RESTART_COOLDOWN_S: "${SAVANT_SUPERVISOR_RESTART_COOLDOWN_S:-300}"
      SAVANT_SUPERVISOR_RESTART_WAIT_S: "${SAVANT_SUPERVISOR_RESTART_WAIT_S:-1800}"
      SAVANT_SUPERVISOR_RESTART_REPLAY: "${SAVANT_SUPERVISOR_RESTART_REPLAY:-false}"
      SAVANT_SUPERVISOR_AUTO_REPAIR_STOPPED_SOURCES: "${SAVANT_SUPERVISOR_AUTO_REPAIR_STOPPED_SOURCES:-false}"
      RUNTIME_OVERVIEW_FORWARDER_CONTAINER: video-analytics-midterm-analysis-forwarder
      RUNTIME_OVERVIEW_FORWARDER_METRICS_URL: http://analysis-forwarder:8081/metrics
    volumes:
      - ../services/api:/app:rw
      - ../libs:/app/libs:ro
      - ../modules/savant_security:/app/modules/savant_security:rw
      - ../infra/generated:/app/infra/generated:rw
      - ../infra/config:/app/infra/config:ro
      - /data/video-analytics/media:/data/video-analytics/media:rw
      - /data/video-analytics/models:/data/video-analytics/models:ro
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: video-analytics-midterm-postgres
    profiles: ["local-postgres"]
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
      POSTGRES_DB: video_analytics
    ports:
      - "5439:5432"
    volumes:
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
      - /data/video-analytics/postgres-midterm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "video", "-d", "video_analytics"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  replay-service:
    image: ghcr.io/insight-platform/savant-replay-x86:v0.6.0
    container_name: video-analytics-midterm-replay-service
    ports:
      - "8098:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DB_PATH: /opt/rocksdb
    volumes:
      - ../modules/savant_replay/config.midterm.json:/opt/etc/config.json:ro
      - /data/video-analytics/replay-midterm:/opt/rocksdb:rw
    depends_on:
      replay-raw-fanout: { condition: service_started }
    restart: unless-stopped

  replay-a:
    image: ghcr.io/insight-platform/savant-replay-x86:v0.6.0
    container_name: video-analytics-midterm-replay-a
    profiles: ["dual-replay-shards", "dual-4090-two-source"]
    ports:
      - "${REPLAY_A_HOST_PORT:-8198}:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DB_PATH: /opt/rocksdb
    volumes:
      - ../modules/savant_replay/config.midterm.replay-a.json:/opt/etc/config.json:ro
      - /data/video-analytics/replay-midterm-a:/opt/rocksdb:rw
