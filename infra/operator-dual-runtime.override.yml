services:
  # The operator production presets are single-GPU dual-branch profiles. Keep
  # the historical dual-GPU compose profile unchanged and narrow Savant B only
  # for containers pre-created for 8090 ownership.
  savant-b:
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
