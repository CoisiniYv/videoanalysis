name: phase3b

services:
  # ====================================================================
  # Backend infrastructure
  # ====================================================================

  redis:
    image: redis:7-alpine
    container_name: phase3b-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: phase3b-postgres
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
      POSTGRES_DB: video_analytics
    ports:
      - "5433:5432"
    volumes:
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "video", "-d", "video_analytics"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  event-worker:
    build:
      context: ../services/event-worker
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: phase3b-event-worker:latest
    container_name: phase3b-event-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://video:video@postgres:5432/video_analytics
      EVENT_STREAM: security.events
      ALERT_STREAM: security.alerts
      RECORD_REQUEST_STREAM: security.record_requests
      RECORDING_ENABLED: "true"
      RECORDING_STRATEGY: "savant_replay"
      DEFAULT_REPLAY_SOURCE_ID: phase3b
      CONSUMER_GROUP: event-workers
      CONSUMER_NAME: event-worker-1
      POLL_TIMEOUT_MS: "2000"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: phase3b-api:latest
    container_name: phase3b-api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://video:video@postgres:5432/video_analytics
      REDIS_URL: redis://redis:6379/0
      ALERT_STREAM: security.alerts
      MEDIA_ROOT: /media
    volumes:
      - /data/video-analytics/media:/media:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # ====================================================================
  # Video pipeline
  # ====================================================================

  rtsp-server:
    image: bluenviron/mediamtx:1.11.3
    container_name: phase3b-rtsp-server
    ports:
      - "8563:8554"
    restart: unless-stopped

  ffmpeg-source:
    image: jrottenberg/ffmpeg:6.1-ubuntu
    container_name: phase3b-ffmpeg-source
    entrypoint: ["ffmpeg"]
    command:
      [
        "-re",
        "-stream_loop", "-1",
        "-i", "/testVideo/test.mp4",
        "-an",
        "-c:v", "libx264",
        "-preset", "veryfast",
        "-tune", "zerolatency",
        "-f", "rtsp",
        "rtsp://rtsp-server:8554/phase3b",
      ]
    volumes:
      - ../testVideo:/testVideo:ro
    depends_on:
      - rtsp-server
    restart: unless-stopped

  # ====================================================================
  # Source adapter — official video-loop-source → Savant ZMQ → Replay ingress
  # SOURCE_ID is the canonical source_id used throughout the media chain
  # ====================================================================

  source-adapter:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:0.6.0
    container_name: phase3b-source-adapter
    entrypoint:
      [
        "/opt/savant/adapters/gst/sources/video_loop.sh",
      ]
    environment:
      SOURCE_ID: phase3b
      LOCATION: /testVideo/test.mp4
      ZMQ_ENDPOINT: dealer+connect:tcp://replay-service:5555
      DOWNLOAD_PATH: /tmp/video-loop-cache
      SYNC_OUTPUT: "false"
    volumes:
      - ../testVideo:/testVideo:ro
    depends_on:
      - replay-service
    restart: unless-stopped

  # ====================================================================
  # Savant — real-time inference + event detection (optional for Phase 3B media tests)
  # ====================================================================

  savant:
    image: ghcr.io/insight-platform/savant-deepstream:0.6.0-7.1
    container_name: phase3b-savant
    entrypoint:
      [
        "bash", "-c",
        "pip install -q redis && exec python -m savant.entrypoint module.yml",
      ]
    working_dir: /opt/savant/src/module
    environment:
      LOGLEVEL: ${LOGLEVEL:-INFO}
      SRC_URL: rtsp://rtsp-server:8554/phase3b
      MODEL_PATH: /models
      DOWNLOAD_PATH: /downloads
      BATCH_SIZE: "1"
      MAX_PARALLEL_STREAMS: "1"
      POSE_BATCH_SIZE: "1"
      ZMQ_SINK_ENDPOINT: pub+connect:ipc:///tmp/sink.ipc
      EVENT_EXPORTER: redis
      REDIS_URL: redis://redis:6379/0
      EVENT_STREAM: security.events
    volumes:
      - ../modules/savant_phase2c:/opt/savant/src/module:rw
      - /data/video-analytics/models:/models:rw
      - /data/video-analytics/downloads:/downloads:rw
      - /data/video-analytics/media:/media:rw
      - ../testVideo:/testVideo:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - rtsp-server
      - redis
    restart: unless-stopped
    profiles:
      - gpu

  # ====================================================================
  # Savant Replay Service (official image)
  # ====================================================================

  replay-service:
    image: ghcr.io/insight-platform/savant-replay-x86:v0.6.0
    container_name: phase3b-replay-service
    ports:
      - "8081:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DB_PATH: /opt/rocksdb
    volumes:
      - ../modules/savant_replay/config.json:/opt/etc/config.json:ro
      - /data/video-analytics/media:/media:rw
    depends_on:
      - rtsp-server
    restart: unless-stopped

  # ====================================================================
  # Video File Sink (official adapter image)
  # ====================================================================

  video-file-sink:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:0.6.0
    container_name: phase3b-video-file-sink
    entrypoint:
      [
        "python", "/opt/savant/adapters/gst/sinks/video_files.py",
      ]
    environment:
      LOGLEVEL: ${LOGLEVEL:-INFO}
      ZMQ_ENDPOINT: sub+bind:tcp://0.0.0.0:6666
      DIR_LOCATION: /media/replay-sink-output/%source_id-%chunk_idx
      SINK_CONTAINER: mkv
    volumes:
      - /data/video-analytics/media:/media:rw
    restart: unless-stopped

  # ====================================================================
  # Clip Worker — consumes security.record_requests, calls Replay API,
  # writes back clip_status / replay_job_id / error_message to DB
  # ====================================================================

  clip-worker:
    build:
      context: ../services/clip-worker
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: phase3b-clip-worker:latest
    container_name: phase3b-clip-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      RECORD_REQUEST_STREAM: security.record_requests
      REPLAY_API_URL: http://replay-service:8080
      REPLAY_JOB_SINK_URL: pub+connect:tcp://video-file-sink:6666
      DATABASE_URL: postgresql://video:video@postgres:5432/video_analytics
      CONSUMER_GROUP: clip-workers
      CONSUMER_NAME: clip-worker-1
      POLL_TIMEOUT_MS: "5000"
      DEFAULT_PRE_SECONDS: "5"
      DEFAULT_POST_SECONDS: "5"
      KEYFRAME_LOOKUP_WINDOW_S: "10"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      replay-service: { condition: service_started }
    restart: unless-stopped

  # ====================================================================
  # Media Worker — monitors sink output, updates events table (idempotent)
  # ====================================================================

  media-worker:
    build:
      context: ../services/media-worker
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: phase3b-media-worker:latest
    container_name: phase3b-media-worker
    environment:
      DATABASE_URL: postgresql://video:video@postgres:5432/video_analytics
      SINK_OUTPUT_DIR: /media/replay-sink-output
      MEDIA_POLL_INTERVAL_S: "10"
    volumes:
      - /data/video-analytics/media:/media:rw
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
