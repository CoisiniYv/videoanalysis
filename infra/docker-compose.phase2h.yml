name: phase2h

services:
  redis:
    image: redis:7-alpine
    container_name: phase2h-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: phase2h-postgres
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
      POSTGRES_DB: video_analytics
    ports:
      - "5432:5432"
    volumes:
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "video", "-d", "video_analytics"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  event-worker:
    image: phase2h-event-worker:latest
    build:
      context: ../services/event-worker
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: phase2h-event-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://video:video@postgres:5432/video_analytics
      EVENT_STREAM: security.events
      ALERT_STREAM: security.alerts
      CONSUMER_GROUP: event-workers
      CONSUMER_NAME: event-worker-1
      POLL_TIMEOUT_MS: "2000"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  api:
    image: phase2h-api:latest
    build:
      context: ../services/api
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: phase2h-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://video:video@postgres:5432/video_analytics
      REDIS_URL: redis://redis:6379/0
      ALERT_STREAM: security.alerts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
