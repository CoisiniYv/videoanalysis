services:
  savant-a:
    environment:
      NVIDIA_VISIBLE_DEVICES: '0'
      BATCH_SIZE: '4'
      POSE_BATCH_SIZE: '4'
      FACE_DETECTOR_BATCH_SIZE: '4'
      FACE_EMBEDDING_BATCH_SIZE: '16'
      FACE_INFER_INTERVAL: '3'
      FACE_EMBEDDING_INFER_INTERVAL: '3'
      MAX_PARALLEL_STREAMS: '64'
      MAX_SAME_SOURCE_FRAMES: '1'
      BATCHED_PUSH_TIMEOUT: '10000'
      SAVANT_STAGE_METRICS_ENABLED: 'true'
      SAVANT_MODULE_FILE: /data/video-analytics/artifacts/pressure60_remux_refill_t4_4fps_1h_20261011_r2/module.pressure.yml
      OUTPUT_FRAME: 'null'
      FRAME_ANNOTATION_SOURCE_STREAM_ENABLED: 'true'
      FRAME_ANNOTATION_STREAM_MODE: dual
      FRAME_ANNOTATION_SOURCE_REDIS_MAXLEN: '10000'
      FACE_SECONDARY_TRACK_ID_ENABLED: 'false'
      FACE_ROI_EXPORT_ENABLED: 'true'
      FACE_ROI_STREAM: security.face_rois.pressure60_remux_refill_t4_4fps_1h_20261011_r2
      FACE_ROI_STREAM_MAXLEN: '20000'
      FACE_ROI_QUEUE_MAXSIZE: '4096'
      FACE_ROI_TTL_MS: '5000'
      FACE_ROI_JPEG_QUALITY: '95'
      ADAFACE_INPUT_OBJECT: disabled.face
      FACE_OBSERVATION_EXPORT_ENABLED: 'false'
      CUDA_MPS_PIPE_DIRECTORY: /tmp/video-analytics-mps-pressure/pipe
      CUDA_MPS_LOG_DIRECTORY: /tmp/video-analytics-mps-pressure/log
      CUDA_MPS_ACTIVE_THREAD_PERCENTAGE: '45'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids:
            - '0'
            capabilities:
            - gpu
    ipc: host
    volumes:
    - /tmp/video-analytics-mps-pressure:/tmp/video-analytics-mps-pressure:rw
    cpuset: 0-2,8-10
  savant-b:
    environment:
      NVIDIA_VISIBLE_DEVICES: '0'
      CUDA_VISIBLE_DEVICES: '0'
      BATCH_SIZE: '4'
      POSE_BATCH_SIZE: '4'
      FACE_DETECTOR_BATCH_SIZE: '4'
      FACE_EMBEDDING_BATCH_SIZE: '16'
      FACE_INFER_INTERVAL: '3'
      FACE_EMBEDDING_INFER_INTERVAL: '3'
      MAX_PARALLEL_STREAMS: '64'
      MAX_SAME_SOURCE_FRAMES: '1'
      BATCHED_PUSH_TIMEOUT: '10000'
      SAVANT_STAGE_METRICS_ENABLED: 'true'
      SAVANT_MODULE_FILE: /data/video-analytics/artifacts/pressure60_remux_refill_t4_4fps_1h_20261011_r2/module.pressure.yml
      OUTPUT_FRAME: 'null'
      FRAME_ANNOTATION_SOURCE_STREAM_ENABLED: 'true'
      FRAME_ANNOTATION_STREAM_MODE: dual
      FRAME_ANNOTATION_SOURCE_REDIS_MAXLEN: '10000'
      FACE_SECONDARY_TRACK_ID_ENABLED: 'false'
      FACE_ROI_EXPORT_ENABLED: 'true'
      FACE_ROI_STREAM: security.face_rois.pressure60_remux_refill_t4_4fps_1h_20261011_r2
      FACE_ROI_STREAM_MAXLEN: '20000'
      FACE_ROI_QUEUE_MAXSIZE: '4096'
      FACE_ROI_TTL_MS: '5000'
      FACE_ROI_JPEG_QUALITY: '95'
      ADAFACE_INPUT_OBJECT: disabled.face
      FACE_OBSERVATION_EXPORT_ENABLED: 'false'
      CUDA_MPS_PIPE_DIRECTORY: /tmp/video-analytics-mps-pressure/pipe
      CUDA_MPS_LOG_DIRECTORY: /tmp/video-analytics-mps-pressure/log
      CUDA_MPS_ACTIVE_THREAD_PERCENTAGE: '45'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids:
            - '0'
            capabilities:
            - gpu
    ipc: host
    volumes:
    - /tmp/video-analytics-mps-pressure:/tmp/video-analytics-mps-pressure:rw
    cpuset: 3-5,11-13
  replay-raw-fanout-a:
    depends_on: !override
    - savant-a
    environment:
      FORWARDER_OUT_ENDPOINT: dealer+connect:tcp://savant-a:5557
      FORWARDER_SAMPLER_ENABLED: 'true'
      ANALYSIS_FPS: 4/1
      ANALYSIS_MIN_FPS: 99/25
      FORWARDER_STRICT_FPS_BUDGET: 'true'
      FORWARDER_MAX_QUEUE_AGE_MS: '30000'
      FORWARDER_QUEUE_MAX_SIZE: '8192'
      FORWARDER_RECEIVE_HWM: '10000'
      FORWARDER_SEND_TIMEOUT_MS: '2000'
      FORWARDER_SEND_RETRIES: '3'
      FORWARDER_SEND_HWM: '1000'
    cpuset: 6,14
  replay-raw-fanout-b:
    depends_on: !override
    - savant-b
    environment:
      FORWARDER_OUT_ENDPOINT: dealer+connect:tcp://savant-b:5557
      FORWARDER_SAMPLER_ENABLED: 'true'
      ANALYSIS_FPS: 4/1
      ANALYSIS_MIN_FPS: 99/25
      FORWARDER_STRICT_FPS_BUDGET: 'true'
      FORWARDER_MAX_QUEUE_AGE_MS: '30000'
      FORWARDER_QUEUE_MAX_SIZE: '8192'
      FORWARDER_RECEIVE_HWM: '10000'
      FORWARDER_SEND_TIMEOUT_MS: '2000'
      FORWARDER_SEND_RETRIES: '3'
      FORWARDER_SEND_HWM: '1000'
    cpuset: 6,14
  adaface-roi-worker:
    profiles:
    - dual-4090-two-source
    environment:
      FACE_ROI_STREAM: security.face_rois.pressure60_remux_refill_t4_4fps_1h_20261011_r2
      FACE_ROI_CONSUMER_GROUP: adaface-roi-pressure60_remux_refill_t4_4fps_1h_20261011_r2
      FACE_ROI_CONSUMER_NAME: adaface-roi-worker-1
      FACE_ROI_TTL_MS: '5000'
      FACE_ROI_BATCH_TIMEOUT_MS: '200'
      FACE_EMBEDDING_BATCH_SIZE: '16'
      CUDA_MPS_PIPE_DIRECTORY: /tmp/video-analytics-mps-pressure/pipe
      CUDA_MPS_LOG_DIRECTORY: /tmp/video-analytics-mps-pressure/log
      CUDA_MPS_ACTIVE_THREAD_PERCENTAGE: '10'
    restart: 'no'
    ipc: host
    volumes:
    - /tmp/video-analytics-mps-pressure:/tmp/video-analytics-mps-pressure:rw
